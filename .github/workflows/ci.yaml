# Tests every push and PR. On a push to master it publishes via zx-semrel using
# npm OIDC Trusted Publishing (no NPM_TOKEN). The trusted-publisher config on
# npmjs.com pins this filename exactly — do not rename `ci.yaml` without
# updating it there first.
name: CI

on: [push, pull_request]

env:
  npm_config_audit: false
  npm_config_fund: false

permissions: {}

jobs:
  build:
    name: Build & test (Node 24)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - run: yarn install --immutable

      - run: yarn build

      - run: yarn test

      # This phase runs untrusted deps + code (install, full suite), so it holds
      # NO secrets. It only *generates* the package and the coverage report and
      # caches them as artifacts; publishing them (npm + Qlty) happens downstream
      # in `release` — the only phase with secret access.
      - uses: actions/upload-artifact@v7
        with:
          name: build
          path: |
            target/esm
            target/ts
            target/dts
            buildstamp.json
            package.json
          retention-days: 1

      - name: Cache coverage report for downstream publish
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: target/coverage
          retention-days: 7

  pr:
    if: github.event_name == 'pull_request'
    name: PR (Node ${{ matrix.node-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        node-version: [24, 22, 20]
        # The full suite already runs on ubuntu/24 in `build`; here that pair
        # would be a duplicate, so it only carries the integration check.
    steps:
      # The real-world fixtures carry paths up to 308 chars (aws-cdk snapshot
      # assets), past Windows' 260-char MAX_PATH — checkout itself fails with
      # exit 128 without the extended-length git API. Must precede checkout.
      - name: Enable git long paths (Windows)
        if: runner.os == 'Windows'
        run: git config --system core.longpaths true

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Enable Corepack
        run: corepack enable

      - run: yarn install --immutable

      - run: yarn build

      - run: yarn test:integration

  release:
    name: Release ${{ github.ref }}
    needs: build
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    environment: release # dedicated env: scopes QLTY_COVERAGE_TOKEN + branch protection
    timeout-minutes: 15
    permissions:
      checks: read
      statuses: write
      contents: write
      id-token: write # OIDC to the npm registry — passwordless publish + provenance
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: actions/download-artifact@v8
        with:
          name: build

      - uses: actions/download-artifact@v8
        with:
          name: coverage
          path: target/coverage

      # NO install here — release holds secrets (npm OIDC + the Qlty token), so it
      # must not install or run untrusted dependency code. It only publishes the
      # pre-built artifacts fetched above.
      - name: Publish coverage to Qlty
        uses: qltysh/qlty-action/coverage@v2
        with:
          token: ${{ secrets.QLTY_COVERAGE_TOKEN }}
          files: target/coverage/lcov.info

      - name: Release via zx-semrel (OIDC scheme)
        env:
          NPM_OIDC: true
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: 'x-access-token'
          GIT_BRANCH: 'master'
          GIT_AUTHOR_NAME: ${{ vars.GIT_AUTHOR_NAME }}
          GIT_AUTHOR_EMAIL: ${{ vars.GIT_AUTHOR_EMAIL }}
          GIT_COMMITTER_NAME: ${{ vars.GIT_COMMITTER_NAME }}
          GIT_COMMITTER_EMAIL: ${{ vars.GIT_COMMITTER_EMAIL }}
          GIT_SIGN_KEY: ${{ secrets.GIT_SIGN_KEY }}
        run: npx zx-semrel

  post-release:
    name: Post-release
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 20 # the lowest supported

      - name: Check running via npx
        run: npm_config_yes=true npx yarn-audit-fix@latest --version

      - name: Check global install
        run: |
          npm i -g yarn-audit-fix@latest
          which yarn-audit-fix
          yarn-audit-fix --version
