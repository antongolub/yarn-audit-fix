# Tests every push and PR. On a push to master it publishes via zx-semrel using
# npm OIDC Trusted Publishing (no NPM_TOKEN). The trusted-publisher config on
# npmjs.com pins this filename exactly — do not rename `ci.yaml` without
# updating it there first.
name: CI

on: [push, pull_request]

env:
  npm_config_audit: false
  npm_config_fund: false

permissions: {}

jobs:
  build:
    name: Build & test (Node 26)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 26

      # `corepack yarn`, not `yarn`: the Windows runner preinstalls yarn 1.x, which
      # shadows the corepack shim on PATH. Going through corepack needs no shims.
      - run: corepack yarn install --immutable

      - run: corepack yarn build

      - run: corepack yarn test

      # This phase runs untrusted deps + code (install, full suite), so it holds
      # NO secrets. It only *generates* the package and the coverage report and
      # caches them as artifacts; publishing them (npm + Qlty) happens downstream
      # in `release` — the only phase with secret access.
      - uses: actions/upload-artifact@v7
        with:
          name: build
          path: |
            target/esm
            target/ts
            target/dts
            target/docs
            buildstamp.json
            package.json
          retention-days: 1

      - name: Cache coverage report for downstream publish
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: target/coverage
          retention-days: 7

  pr:
    if: github.event_name == 'pull_request'
    name: PR (Node ${{ matrix.node-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, windows-latest]
        node-version: [26, 20]
        # `build` runs the full suite; these cells only smoke the ends of the range.
    steps:
      # real-world fixtures exceed Windows' 260-char MAX_PATH; checkout fails
      # without this. Must precede checkout.
      - name: Enable git long paths (Windows)
        if: runner.os == 'Windows'
        run: git config --system core.longpaths true

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      # `corepack yarn`, not `yarn`: the Windows runner preinstalls yarn 1.x, which
      # shadows the corepack shim on PATH. Going through corepack needs no shims.
      - run: corepack yarn install --immutable

      - run: corepack yarn build

      - run: corepack yarn test:integration

  release:
    name: Release ${{ github.ref }}
    needs: build
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    environment: release # dedicated env: scopes QLTY_COVERAGE_TOKEN + branch protection
    timeout-minutes: 15
    permissions:
      checks: read
      statuses: write
      contents: write
      packages: write # zx-semrel also publishes the org-scoped alias to GH Packages
      id-token: write # OIDC to the npm registry — passwordless publish + provenance
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - uses: actions/download-artifact@v8
        with:
          name: build

      - uses: actions/download-artifact@v8
        with:
          name: coverage
          path: target/coverage

      # NO install here — release holds secrets (npm OIDC + the Qlty token), so it
      # must not install or run untrusted dependency code. It only publishes the
      # pre-built artifacts fetched above.
      - name: Publish coverage to Qlty
        uses: qltysh/qlty-action/coverage@v2
        with:
          token: ${{ secrets.QLTY_COVERAGE_TOKEN }}
          files: target/coverage/lcov.info

      - name: Release via zx-semrel (OIDC scheme)
        env:
          NPM_OIDC: true
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: 'x-access-token'
          GIT_BRANCH: 'master'
          GIT_AUTHOR_NAME: ${{ vars.GIT_AUTHOR_NAME }}
          GIT_AUTHOR_EMAIL: ${{ vars.GIT_AUTHOR_EMAIL }}
          GIT_COMMITTER_NAME: ${{ vars.GIT_COMMITTER_NAME }}
          GIT_COMMITTER_EMAIL: ${{ vars.GIT_COMMITTER_EMAIL }}
          GIT_SIGN_KEY: ${{ secrets.GIT_SIGN_KEY }}
        run: npx zx-semrel

      # gh-pages is the only place the API reference is reachable from; nothing
      # else publishes it. Runs after zx-semrel so the site matches the cut version.
      - name: Publish docs to gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          GIT_AUTHOR_NAME: ${{ vars.GIT_AUTHOR_NAME }}
          GIT_AUTHOR_EMAIL: ${{ vars.GIT_AUTHOR_EMAIL }}
          GIT_COMMITTER_NAME: ${{ vars.GIT_COMMITTER_NAME }}
          GIT_COMMITTER_EMAIL: ${{ vars.GIT_COMMITTER_EMAIL }}
        run: |
          # ggcp exits 0 even when it matches nothing, so assert the input exists
          # rather than trust the exit code.
          test -f target/docs/index.html
          npm_config_yes=true npx ggcp@1.11.0 'target/docs>**/*' \
            "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git/gh-pages" \
            --message='docs: update api reference'

  post-release:
    name: Post-release
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: '18.12' # highest engines.node floor in the shipped closure (@yarnpkg/libzip)

      - name: Check running via npx
        run: npm_config_yes=true npx yarn-audit-fix@latest --version

      # Installs from the registry on purpose: this checks the published artifact,
      # not the local tree.
      - name: Check global install
        run: npm i -g yarn-audit-fix@latest # zizmor: ignore[adhoc-packages]

      - name: Verify the installed binary
        run: |
          which yarn-audit-fix
          yarn-audit-fix --version
